name: push_conf_daily

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: paperbot-main-writer-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FEISHU_URL: ${{ secrets.FEISHU_URL }}
      LIMITS: 10
      PUSH_INTERVAL: 5

    steps:
      - name: Checkout repository and LFS data
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Push conference papers
        id: conference_push
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python paperBotV2/conf_summary/conf_daily.py
          push_exit_code=$?
          echo "exit_code=$push_exit_code" >> "$GITHUB_OUTPUT"
          exit "$push_exit_code"

      - name: Commit and push state checkpoint
        id: state_checkpoint
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          state_path="paperBotV2/conf_summary/data/push_state.json"
          if [[ ! -f "$state_path" ]]; then
            echo "No conference push state file exists; nothing to checkpoint."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add -- "$state_path"
          if git diff --cached --quiet; then
            echo "Conference push state is unchanged."
            exit 0
          fi

          git commit -m "chore: update conference push state"

          for attempt in 1 2 3; do
            echo "Checkpoint push attempt $attempt/3"
            if ! git fetch origin \
              "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"; then
              echo "Fetch failed on attempt $attempt/3."
              continue
            fi
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "Unable to rebase the conference state checkpoint."
              exit 1
            fi
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "Push was rejected on attempt $attempt/3; retrying."
          done

          echo "Unable to persist the conference state checkpoint after 3 attempts."
          exit 1

      - name: Preserve conference push result
        if: ${{ always() }}
        shell: bash
        env:
          PUSH_OUTCOME: ${{ steps.conference_push.outcome }}
          PUSH_EXIT_CODE: ${{ steps.conference_push.outputs.exit_code }}
          CHECKPOINT_OUTCOME: ${{ steps.state_checkpoint.outcome }}
        run: |
          set -u
          if [[ "$PUSH_OUTCOME" != "success" ]]; then
            exit_code="${PUSH_EXIT_CODE:-1}"
            if [[ ! "$exit_code" =~ ^[0-9]+$ ]] || (( exit_code == 0 )); then
              exit_code=1
            fi
            echo "Conference paper push failed with exit code $exit_code."
            if [[ "$CHECKPOINT_OUTCOME" != "success" ]]; then
              echo "State checkpoint persistence also failed."
            fi
            exit "$exit_code"
          fi

          if [[ "$CHECKPOINT_OUTCOME" != "success" ]]; then
            echo "Conference paper push succeeded, but state checkpoint persistence failed."
            exit 1
          fi

          echo "Conference paper push and state checkpoint persistence succeeded."
